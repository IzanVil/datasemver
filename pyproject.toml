[build-system]
requires = ["setuptools>=83"]  # CVE-2025-47273, CVE-2026-59890 (MANIFEST.in bypass)
build-backend = "setuptools.build_meta"

[project]
name = "datasemver"
version = "0.2.4"
description = "Semantic versioning for datasets: diff two dataset versions and get the bump they deserve."
# The project page has to stand on its own: the repository it would otherwise link
# to and pull images from is not always public, and a broken page outlives that.
readme = "README.pypi.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Izan Vilchez", email = "izanvilchez6@gmail.com" }]
maintainers = [{ name = "Izan Vilchez", email = "izanvilchez6@gmail.com" }]
keywords = [
    "semver",
    "datasets",
    "data-versioning",
    "changelog",
    "data-quality",
    "schema-diff",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Version Control",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=1.5",
    # Reading data no one vouched for is the point of this library, so the floor sits above
    # every advisory against pyarrow: CVE-2023-47248 (critical, code execution from a
    # malicious Parquet file, fixed in 14.0.1), CVE-2024-52338 (17.0.0) and CVE-2026-25087
    # (23.0.1). 23.0.1 still ships wheels for 3.10 to 3.14, so this costs no supported
    # Python version.
    "pyarrow>=23.0.1",
    "pydantic>=2.4",  # CVE-2024-3772, ReDoS
    "pyyaml>=6",
    "typer>=0.9",
    "rich>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",  # CVE-2025-71176, tmpdir handling
    "pytest-cov>=4",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # Everything below 0.0.31 carries at least one of eight advisories, including
    # CVE-2026-24486 (arbitrary file write) and four denial-of-service issues. This is the
    # parser every dashboard upload passes through.
    "python-multipart>=0.0.31",
]

[project.urls]
Homepage = "https://github.com/IzanVil/datasemver"
Repository = "https://github.com/IzanVil/datasemver"
Issues = "https://github.com/IzanVil/datasemver/issues"

[project.scripts]
datasemver = "datasemver.cli.main:app"

[tool.setuptools.packages.find]
include = ["datasemver*"]

[tool.setuptools.package-data]
datasemver = ["rules/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=datasemver",
    "--cov=web",
    "--cov=scripts",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
]
markers = [
    "web: tests that exercise the dashboard backend and need the web extra",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Markdown is prose, not source. The formatter reflows the Python blocks inside the
# READMEs, where the alignment is a reading decision rather than a style violation.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# The style CONTRIBUTING asks for, made checkable: pycodestyle and pyflakes for the basics,
# then the rules that catch what review keeps having to catch by hand.
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import order
    "B",         # bugbear
    "UP",        # pyupgrade
    "SIM",       # simplify
    "C4",        # comprehensions
    "RET",       # returns
    "PTH",       # pathlib over os.path
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# `File(...)` and `Form(...)` in a default is how FastAPI declares a parameter; the call is
# the framework's marker object, not a mutable default evaluated once by mistake.
"web/backend/main.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
files = ["datasemver", "web", "scripts"]
# The package ships py.typed, so the annotations it advertises have to hold up.
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Neither ships type information, and stubbing them here would be guesswork.
module = ["pandas.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
omit = [
    "*/__main__.py",
    # Regenerates the README images by driving a headless browser. It is maintenance
    # tooling rather than product: it ships in no distribution, and when it breaks the
    # images simply are not rebuilt, which is visible immediately. Covering it would mean
    # asserting against a mocked browser, which asserts nothing about the images.
    "scripts/capture_cli.py",
]

[tool.coverage.report]
fail_under = 85
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
