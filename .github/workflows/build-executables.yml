name: Executables

# One file per platform that carries its own Python, for people who want to run the tool
# without installing anything. PyInstaller freezes the interpreter it runs under and cannot
# cross-compile, so each binary comes from a runner of its own operating system; that is the
# whole reason this is a matrix rather than three flags on one build.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: executables-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }} · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux, arch: x86_64 }
          - { runner: windows-latest, platform: windows, arch: x86_64 }
          # macos-latest is Apple Silicon. An Intel Mac cannot run that binary, so it gets
          # its own runner; the archive name carries the architecture to tell them apart.
          - { runner: macos-latest, platform: macos, arch: arm64 }
          - { runner: macos-15-intel, platform: macos, arch: x86_64 }

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"

      # The extras come from the script rather than from this line. Someone running the
      # binary has no way to add one later, so what goes in is what they will ever have --
      # and a list maintained in two places is a list that ends up different in two places.
      - name: Install the package with the extras the binary carries
        shell: bash
        run: |
          extras=$(python -c "import sys; sys.path.insert(0, 'scripts'); import build_executables as b; print(','.join(sorted(b.BUNDLED_EXTRAS)))")
          echo "the binary is declared to carry: $extras"
          pip install ".[$extras]" "pyinstaller>=6.0"

      # The script checks the binary it just built -- help, the bundled rules, and one file
      # of every format it claims to read -- and fails the build when any of that is missing,
      # so there is no separate smoke test here to drift out of step with it.
      - name: Build and verify the executable
        run: python scripts/build_executables.py --platform ${{ matrix.platform }}

      - name: Upload the archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: executable-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  attach:
    name: Attach to the release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download every archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          pattern: executable-*
          merge-multiple: true
          path: dist/

      - name: Attach them to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          fail_on_unmatched_files: true
