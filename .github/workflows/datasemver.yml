name: DataSemver

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: datasemver-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse changed datasets
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install DataSemver
        run: pip install -e .

      - name: Resolve the base ref
        id: base
        # Values from the event reach the shell through the environment, never through
        # ${{ }} interpolation: expanded inline they would be pasted into the script before
        # bash parses it, so a ref named to look like shell would run as shell.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
            git fetch --no-tags origin "$BASE_REF"
          else
            base="$BEFORE"
            if [ -z "$base" ] || ! git rev-parse --verify --quiet "$base^{commit}" > /dev/null; then
              base="HEAD^"
            fi
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"

      - name: Analyse the datasets that changed
        id: datasemver
        env:
          BASE_REF: ${{ steps.base.outputs.ref }}
          REPORT_PATH: ${{ runner.temp }}/datasemver-report.md
        run: |
          python scripts/run_datasemver_on_pr.py \
            --base-ref "$BASE_REF" \
            --output "$REPORT_PATH"

      - name: Comment on the pull request
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.datasemver.outputs.has_report == 'true'
        uses: actions/github-script@v9
        env:
          REPORT_PATH: ${{ runner.temp }}/datasemver-report.md
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- datasemver-report -->';
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
