[build-system]
requires = ["setuptools>=83"]  # CVE-2025-47273, CVE-2026-59890 (MANIFEST.in bypass)
build-backend = "setuptools.build_meta"

[project]
name = "datasemver"
version = "0.2.3"
description = "Semantic versioning for datasets: diff two dataset versions and get the bump they deserve."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Izan Vilchez", email = "izanvilchez6@gmail.com" }]
maintainers = [{ name = "Izan Vilchez", email = "izanvilchez6@gmail.com" }]
keywords = [
    "semver",
    "datasets",
    "data-versioning",
    "changelog",
    "data-quality",
    "schema-diff",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Version Control",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=1.5",
    # Reading data no one vouched for is the point of this library, so the floor sits above
    # every advisory against pyarrow: CVE-2023-47248 (critical, code execution from a
    # malicious Parquet file, fixed in 14.0.1), CVE-2024-52338 (17.0.0) and CVE-2026-25087
    # (23.0.1). 23.0.1 still ships wheels for 3.10 to 3.14, so this costs no supported
    # Python version.
    "pyarrow>=23.0.1",
    "pydantic>=2.4",  # CVE-2024-3772, ReDoS
    "pyyaml>=6",
    "typer>=0.9",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "pytest-cov>=4", "httpx>=0.27"]  # CVE-2025-71176, tmpdir handling
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # Everything below 0.0.31 carries at least one of eight advisories, including
    # CVE-2026-24486 (arbitrary file write) and four denial-of-service issues. This is the
    # parser every dashboard upload passes through.
    "python-multipart>=0.0.31",
]

[project.urls]
Homepage = "https://github.com/IzanVil/datasemver"
Repository = "https://github.com/IzanVil/datasemver"
Documentation = "https://github.com/IzanVil/datasemver/blob/main/README.md"
Issues = "https://github.com/IzanVil/datasemver/issues"

[project.scripts]
datasemver = "datasemver.cli.main:app"

[tool.setuptools.packages.find]
include = ["datasemver*"]

[tool.setuptools.package-data]
datasemver = ["rules/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=datasemver",
    "--cov=web",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
]
markers = [
    "web: tests that exercise the dashboard backend and need the web extra",
]

[tool.coverage.run]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
