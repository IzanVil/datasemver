[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "datasemver"
version = "0.1.0"
description = "Semantic versioning for datasets: diff two dataset versions and get the bump they deserve."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Izan Vilchez", email = "izanvilchez6@gmail.com" }]
maintainers = [{ name = "Izan Vilchez", email = "izanvilchez6@gmail.com" }]
keywords = [
    "semver",
    "datasets",
    "data-versioning",
    "changelog",
    "data-quality",
    "schema-diff",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Version Control",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=1.5",
    "pyarrow>=10",
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.9",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]

[project.urls]
Homepage = "https://github.com/IzanVil/datasemver"
Repository = "https://github.com/IzanVil/datasemver"
Documentation = "https://github.com/IzanVil/datasemver/blob/main/README.md"
Issues = "https://github.com/IzanVil/datasemver/issues"

[project.scripts]
datasemver = "datasemver.cli.main:app"

[tool.setuptools.packages.find]
include = ["datasemver*"]

[tool.setuptools.package-data]
datasemver = ["rules/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=datasemver",
    "--cov=web",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml",
]
markers = [
    "web: tests that exercise the dashboard backend and need the web extra",
]

[tool.coverage.run]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 85
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
