<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>DataSemver</title>
  <!-- A ring: every version, and the one step a comparison takes around it. Colours written
       out, because a favicon is fetched on its own and inherits nothing from the page. -->
  <style>
    .ring { stroke: #0a0d14; } .dot { fill: #0a0d14; }
    @media (prefers-color-scheme: dark) { .ring { stroke: #e9edf3; } .dot { fill: #e9edf3; } }
  </style>
  <circle class="ring" cx="16" cy="16" r="12" fill="none" stroke-width="4" opacity="0.3"/>
  <path d="M16 4a12 12 0 0 1 10.4 18" fill="none" stroke="#3aa0ff" stroke-width="4" stroke-linecap="round"/>
  <circle class="dot" cx="16" cy="16" r="3.5"/>
</svg>
