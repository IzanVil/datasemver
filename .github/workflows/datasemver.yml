name: DataSemver

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: datasemver-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse changed datasets
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # The comparison reads each dataset as the base branch has it, which a shallow
          # clone does not carry.
          fetch-depth: 0

      # The action in this repository, run from the working tree rather than from a tag. It
      # is the same one `uses: IzanVil/datasemver@v1` runs elsewhere, so every pull request
      # here is a rehearsal of what the action does for everyone else -- and a change that
      # breaks it fails on the branch that made it rather than in someone else's repository.
      - name: Run DataSemver
        uses: ./
        with:
          # Unset here, because this repository's datasets are dashboard fixtures and
          # changing them is ordinary work. Set the variable to patch, minor or major in a
          # repository that wants its data reviewed the way its code is.
          fail-on: ${{ vars.DATASEMVER_FAIL_ON }}
